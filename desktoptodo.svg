<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AC8FA"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
  </defs>
  <!-- 圆角底板 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <!-- 记事本主体（微微错位，露出版脊） -->
  <rect x="42" y="34" width="50" height="68" rx="8" fill="#3E8EE0" opacity="0.55"/>
  <rect x="36" y="30" width="52" height="70" rx="9" fill="#FFFFFF"/>
  <!-- 顶部装订线圈 -->
  <g stroke="#8FA3B8" stroke-width="3.6" stroke-linecap="round" fill="none">
    <path d="M46 30 v-7"/>
    <path d="M60 30 v-7"/>
    <path d="M74 30 v-7"/>
    <path d="M88 30 v-7"/>
  </g>
  <!-- 内容横线：两条灰、一条橙色（DDL） -->
  <g stroke-linecap="round" fill="none">
    <line x1="46" y1="52" x2="78" y2="52" stroke="#C3CEDA" stroke-width="5"/>
    <line x1="46" y1="66" x2="78" y2="66" stroke="#C3CEDA" stroke-width="5"/>
    <line x1="46" y1="80" x2="68" y2="80" stroke="#FF9F0A" stroke-width="5"/>
  </g>
  <!-- 右下角对勾徽标 -->
  <circle cx="94" cy="94" r="17" fill="#30D158"/>
  <path d="M86 94 L92 100 L103 88" fill="none" stroke="#FFFFFF"
        stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
